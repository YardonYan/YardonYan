<svg width="1100" height="420" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A private collection — code as poetry, selected works">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D9A46B"/>
      <stop offset="46%" stop-color="#B2653F"/>
      <stop offset="100%" stop-color="#6E3A26"/>
    </linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#E8CFA2"/>
      <stop offset="42%" stop-color="#C9A46E"/>
      <stop offset="100%" stop-color="#9A7A4E"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="6%" r="66%">
      <stop offset="0%" stop-color="#FFD9A0" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#FFD9A0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="420" fill="url(#wall)"/>
  <rect width="1100" height="420" fill="url(#glow)"/>
  <rect x="40" y="30" width="1020" height="360" fill="none" stroke="#F0DCAE" stroke-width="1.6"/>
  <rect x="54" y="44" width="992" height="332" fill="none" stroke="#C99A72" stroke-width="0.8"/>

  <text x="84" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3.4" fill="#F2DDC6">A PRIVATE COLLECTION · EST. 2022</text>
  <text x="1016" y="84" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#FFDFAE">NO. 01 / 01</text>
  <text x="80" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="96" letter-spacing="-0.8" fill="#FFF8EC">Yardon</text>
  <text x="84" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="24" letter-spacing="3" fill="#FFF8EC">代码如诗，逻辑如词</text>
  <text x="84" y="274" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.6" fill="#F2DDC6">CODE AS POETRY · LOGIC AS WORDS</text>
  <line x1="84" y1="304" x2="294" y2="304" stroke="#FFDFAE" stroke-width="1.2"/>
  <text x="84" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#F2DDC6">SELECTED WORKS · 2022—2026</text>
  <text x="1016" y="346" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#F2DDC6">CURATED BY THE AUTHOR</text>
